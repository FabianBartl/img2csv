<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Interactive Table OCR Extractor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<div class="toolbar">
    <div class="tool-group">
        <label for="image-upload" class="file-label">Choose Image</label>
        <input type="file" id="image-upload" accept="image/*">
    </div>

    <div class="tool-group">
        <label>Rows: <input type="number" id="rows-input" value="4" min="1"></label>
        <label>Cols: <input type="number" id="cols-input" value="3" min="1"></label>
    </div>

    <button type="button" id="btn-draw" class="btn primary" onclick="startDrawing()">1. Draw Table</button>

    <div class="tool-group">
        <label for="text-color">Color:</label>
        <input type="color" id="text-color" value="#d10000" onchange="updateTextColor(this.value)">
    </div>

    <button type="button" id="btn-ocr" class="btn" disabled>2. Run OCR</button>
    <button type="button" id="btn-cancel-ocr" class="btn danger" style="display: none;" onclick="cancelOCR()">Cancel OCR</button>

    <div class="tool-group toggle-group">
        <label class="switch-label">
            <input type="checkbox" id="freeze-toggle" disabled>
            <span class="slider"></span>
            <span id="freeze-text">Frozen Layout</span>
        </label>
    </div>

    <div class="tool-group">
        <label>Opacity: 
            <input type="range" id="opacity-slider" min="0" max="1" step="0.1" value="1" oninput="updateOpacity(this.value)">
        </label>
    </div>

    <div class="tool-group toggle-group">
        <label class="switch-label">
            <input type="checkbox" id="flicker-toggle" onchange="toggleFlicker(this.checked)">
            <span class="slider"></span>
            <span>Auto Flicker</span>
        </label>
    </div>

    <div class="tool-group">
        <label>Speed: 
            <input type="range" id="flicker-speed" min="1" max="10" step="1" value="4" title="Flicker frequency (Hz)" oninput="updateFlickerSpeed(this.value)">
        </label>
    </div>

    <div class="tool-group toggle-group">
        <label class="switch-label">
            <input type="checkbox" id="training-toggle">
            <span class="slider"></span>
            <span>Fine-Training Data</span>
        </label>
    </div>

    <button type="button" id="btn-clear" class="btn warning" disabled>Clear Text</button>
    <button type="button" id="btn-csv" class="btn success" disabled>Export CSV</button>
</div>

<div id="workspace">
    <img id="source-image" src="" style="display:none;">
    <div id="draw-layer"></div>
    
    <div id="grid-container">
        <div id="move-handle" title="Drag to move entire table">Move Table</div>
        
        <div id="resize-tl-handle" class="corner-resize" title="Drag to resize from top-left"></div>
        <div id="resize-br-handle" class="corner-resize" title="Drag to resize from bottom-right"></div>
        
        <div id="add-col-btn" title="Add column to right edge">+</div>
        <div id="add-row-btn" title="Add row to bottom edge">+</div>
        
        <div id="col-handles"></div>
        <div id="row-handles"></div>
        <div id="cells-layer"></div>
    </div>
</div>

<div id="inspection-strip">
    <div class="strip-canvas-container">
        <canvas id="strip-canvas"></canvas>
    </div>
    <div class="strip-info">
        <label id="strip-meta">Active Cell (Row -, Col -)</label>
        <input type="text" id="strip-input" placeholder="Edit current cell text...">
    </div>
</div>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
